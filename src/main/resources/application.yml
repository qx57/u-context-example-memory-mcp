server:
  address: 127.0.0.1
  port: ${MCP_MEMORY_HTTP_PORT:8085}
  error:
    whitelabel:
      enabled: false
spring:
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
    parser:
      strict-duplicate-detection: true
    serialization:
      write-dates-as-timestamps: false
  ai:
    mcp:
      server:
        name: test-memory
        version: 0.1.0
        stdio: true
        type: SYNC
        request-timeout: 30s
        capabilities:
          resource: false
          prompt: false
          completion: false
        tool-change-notification: false
        annotation-scanner:
          enabled: false
logging:
  level:
    io.modelcontextprotocol.server: "OFF"
