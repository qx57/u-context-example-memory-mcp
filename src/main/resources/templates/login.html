<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · Память тестов</title>
    <link rel="stylesheet" th:href="@{/ui.css}">
</head>
<body class="login">
<main class="panel">
    <h1>Память тестов</h1>
    <p th:if="${param.error}" class="error" role="alert">Проверьте токен оператора.</p>
    <form method="post" th:action="@{/login}">
        <input type="hidden" name="username" value="operator">
        <label>Токен оператора<input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit">Войти</button>
    </form>
</main>
</body>
</html>
